[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topology-format-converter"
version = "0.3.0"
description = "Modality conversion utilities for topology optimization grids, samples, sparse voxels, point clouds, and meshes."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Topology Format Converter contributors" }
]
dependencies = [
  "numpy",
  "scipy",
  "trimesh",
  "scikit-image"
]

[project.optional-dependencies]
dev = ["pytest"]
selto = ["torch"]

[project.scripts]
topology-convert = "topology_format_converter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["topology_format_converter*"]
